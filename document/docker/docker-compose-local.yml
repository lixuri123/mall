name: mall-local

services:
  mysql:
    image: mysql:8.4.7
    # 应用 JDBC 使用 serverTimezone=Asia/Shanghai，数据库必须保持同一时区，
    # 否则 NOW()/expire_time 比较会相差 8 小时，超时判定完全失效。
    command: --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall
    ports:
      - "3307:3306"
    volumes:
      - mall_mysql_84:/var/lib/mysql
      - ../sql/mall.sql:/docker-entrypoint-initdb.d/mall.sql:ro

  redis:
    image: redis:7.4.7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - mall_redis_74:/data

  # A 阶段使用；B 阶段改用 RocketMQ 后保留定义以便回退/对比，默认不再随全量 up 启动。
  # 如需对比：docker compose -p mall-local -f document/docker/docker-compose-local.yml up -d rabbitmq
  rabbitmq:
    image: rabbitmq:4.2.9-management
    environment:
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall
      RABBITMQ_DEFAULT_VHOST: /mall
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mall_rabbitmq_42:/var/lib/rabbitmq

  # B 阶段：订单超时取消消息改由 RocketMQ 普通消息承载。
  # 到期判断仍在本地消息表，不用 Broker 延迟消息；重试才使用固定短延迟级别。
  # 只启 NameServer + Broker（Remoting 协议），不需要 gRPC Proxy。
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq-broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
    depends_on:
      - rocketmq-namesrv

  mongo:
    image: mongo:8.0.16
    ports:
      - "27017:27017"
    volumes:
      - mall_mongo_80:/data/db

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: mall/elasticsearch-ik:8.18.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - mall_elasticsearch_818:/usr/share/elasticsearch/data

volumes:
  mall_mysql_84:
  mall_redis_74:
  mall_rabbitmq_42:
  mall_mongo_80:
  mall_elasticsearch_818:
