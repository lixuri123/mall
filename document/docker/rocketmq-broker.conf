# mall-local 本地验证用 Broker 配置
# 容器上报地址为 127.0.0.1，配合 10911 端口映射，宿主机上的 Java 客户端才能连上；
# 不设置时 NameServer 会返回容器内网 IP（172.x），宿主机不可达。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = rocketmq-namesrv:9876
brokerIP1 = 127.0.0.1

# 生产/验证环境都要求预建 Topic：关闭自动创建后，发送到不存在的 Topic 会返回
# No route info of this topic，对应 B 阶段 PublishOutcome.UNROUTABLE 故障分支。
autoCreateTopicEnable = false

# 同步刷盘：SendResult = SEND_OK 时消息已落盘，语义上等价于 A/B 阶段的 Publisher Confirm。
flushDiskType = SYNC_FLUSH
brokerRole = ASYNC_MASTER
deleteWhen = 04
fileReservedTime = 48
