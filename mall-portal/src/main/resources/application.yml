spring:
  application:
    name: mall-portal
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-portal-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

secure:
  ignored:
    urls: #安全路径白名单
      - /swagger-ui/
      - /v3/api-docs/*
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /sso/**
      - /home/**
      - /product/**
      - /brand/**
      - /alipay/**

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 自定义redis key
redis:
  database: mall
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    authCode: 90 # 验证码超期时间
    common: 86400 # 24小时

mongo:
  insert:
    sqlEnable: true # 用于控制是否通过数据库数据来插入mongo

# 消息队列定义
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue

# A 阶段：订单状态与库存一致性
mall:
  order:
    # 仅隔离测试环境可开启；开启后才有 /order/paySuccess、/order/cancelOrder 调试入口
    debug-endpoints-enabled: false
    # 超时扫描兜底：消息发布后仍未完成取消时，按固定到期时间逐单补偿
    timeout-scan:
      enabled: true
      initial-delay-ms: 30000
      interval-ms: 60000
    # B 阶段：本地消息表 + 到期投递 + Publisher Confirm/Return + 受控消费重试
    outbox:
      exchange: mall.order.direct
      routing-key: mall.order.cancel
      admin-enabled: false
      dispatch:
        enabled: true
        initial-delay-ms: 3000
        interval-ms: 5000
        batch-size: 100
        lease-seconds: 30
        confirm-timeout-ms: 5000
        max-retry: 5
        retry-base-seconds: 5
        retry-max-seconds: 300
      consume:
        max-retry: 3
        # 固定 TTL（所有重试消息延迟相同，无队头阻塞）；测试也使用同一数值，避免队列重声明冲突
        retry-ttl-ms: 1000
      metrics:
        enabled: true
        interval-ms: 60000
        pending-warn-threshold: 100
        oldest-pending-warn-seconds: 300

